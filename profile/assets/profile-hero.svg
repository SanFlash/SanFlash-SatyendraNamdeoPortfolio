<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Satyendra Kumar Namdeo — QA Automation Engineer</title>
  <desc id="desc">A futuristic midnight-indigo and violet banner with cyan orbital lines and a software engineering identity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B1B"/>
      <stop offset=".52" stop-color="#151039"/>
      <stop offset="1" stop-color="#071A2D"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
