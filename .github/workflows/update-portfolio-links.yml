name: Update portfolio project links

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-portfolio:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update portfolio project cards
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          script_path = Path('script.js')
          html_path = Path('explore.html')
          script = script_path.read_text(encoding='utf-8')
          html = html_path.read_text(encoding='utf-8')

          # Remove RecruitSync from the project data and visible static cards.
          script = re.sub(r"\n recruitsync:\{.*?\},\n satyon:", "\n satyon:", script, count=1, flags=re.S)
          html = re.sub(r'<article[^>]*data-project=["\']recruitsync["\'][\s\S]*?</article>\s*', '', html, count=1)

          # Correct GitHub URLs for the requested projects.
          script = script.replace("satyon:{type:'AI RESEARCH',title:'SATYON-AI',body:", "satyon:{type:'AI RESEARCH',title:'SATYON-AI',body:")
          script = script.replace("url:'https://github.com/SanFlash'},\n cricapp:", "url:'https://github.com/SanFlash/SATYON-AI'},\n cricapp:", 1)
          script = script.replace("cricapp:{type:'REAL-TIME APP',title:'Cric-App',body:", "cricapp:{type:'REAL-TIME APP',title:'Cric-App',body:")
          script = script.replace("url:'https://github.com/SanFlash/cric-app'},\n droidtestx:", "url:'https://github.com/SanFlash/cric-app'},\n satynqa:{type:'QA PLATFORM',title:'SatynQA',body:'QA-focused web testing platform and automation workflow project.',tags:['QA','Automation','Testing'],url:'https://github.com/SanFlash/SatynQA'},\n skbh:{type:'SPORTS APP',title:'SKBH Table Tennis',body:'Table tennis tournament and match-management application for organizing players, matches and competition workflows.',tags:['Python','Web','Sports'],url:'https://github.com/SanFlash/SKBH_TT'},\n droidtestx:", 1)

          # Add the requested live/demo links to the project-card UI.
          marker = "const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];"
          injected = r'''const projectLinks={
 cricapp:{github:'https://github.com/SanFlash/cric-app',live:'https://cric-app-gilt.vercel.app/'},
 satyon:{github:'https://github.com/SanFlash/SATYON-AI',live:'https://satyon-ai.vercel.app/'},
 satynqa:{github:'https://github.com/SanFlash/SatynQA',live:'https://satyn-qa.vercel.app/'},
 skbh:{github:'https://github.com/SanFlash/SKBH_TT',live:'https://tt-clash78.vercel.app/'}
};
const projectLinkStyle=document.createElement('style');
projectLinkStyle.textContent='.project-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.project-links a{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border:1px solid rgba(255,255,255,.12);border-radius:10px;text-decoration:none;font-size:.82rem;font-weight:700;color:inherit;background:rgba(255,255,255,.035);transition:transform .2s ease,border-color .2s ease,background .2s ease}.project-links a:hover{transform:translateY(-2px);border-color:rgba(98,232,255,.55);background:rgba(98,232,255,.08)}.project-links .live-link{border-color:rgba(98,232,255,.3)}';
document.head.appendChild(projectLinkStyle);
function addProjectLinks(){Object.entries(projectLinks).forEach(([key,links])=>{document.querySelectorAll(`.project-card[data-project="${key}"]`).forEach(card=>{if(card.querySelector('.project-links'))return;const wrap=document.createElement('div');wrap.className='project-links';wrap.innerHTML=`<a class="github-link" href="${links.github}" target="_blank" rel="noopener noreferrer"><i class="bi bi-github"></i> GitHub</a><a class="live-link" href="${links.live}" target="_blank" rel="noopener noreferrer"><i class="bi bi-box-arrow-up-right"></i> Live Demo</a>`;card.appendChild(wrap)})})}
'''
          if 'const projectLinks={' not in script:
              script = script.replace(marker, marker + "\n" + injected, 1)

          # Add SatynQA and SKBH to the project archive generated by script.js.
          old_archive = "['satyenai','13','Satyen78AI','AI × EDUCATION']"
          new_archive = old_archive + ",['satynqa','14','SatynQA','QA PLATFORM'],['skbh','15','SKBH Table Tennis','SPORTS APP']"
          script = script.replace(old_archive, new_archive, 1)

          # Remove RecruitSync and attach project links after all cards are rendered.
          runtime_marker = "const hero=$('.hero');"
          runtime_code = "document.querySelectorAll('.project-card[data-project=\"recruitsync\"]').forEach(el=>el.remove());\naddProjectLinks();\n"
          if 'addProjectLinks();' not in script:
              script = script.replace(runtime_marker, runtime_code + runtime_marker, 1)

          script_path.write_text(script, encoding='utf-8')
          html_path.write_text(html, encoding='utf-8')
          PY

      - name: Verify changes
        run: |
          grep -q "cric-app-gilt.vercel.app" script.js
          grep -q "satyon-ai.vercel.app" script.js
          grep -q "satyn-qa.vercel.app" script.js
          grep -q "tt-clash78.vercel.app" script.js
          ! grep -q "data-project=\"recruitsync\"" explore.html

      - name: Commit portfolio changes and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/update-portfolio-links.yml
          git add script.js explore.html .github/workflows/update-portfolio-links.yml
          git commit -m "feat: add live and GitHub links to project cards"
          git push